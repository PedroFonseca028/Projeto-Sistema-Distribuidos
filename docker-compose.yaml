services:
  broker:
    build: ./broker

  proxy:
    build: ./proxy

  server1:
    build: ./server
    environment:
      - SERVER_ID=1
      - BROKER_URL=tcp://broker:5556
      - PROXY_URL=tcp://proxy:5557
    volumes:
      - ./data/server1:/app/data
    depends_on:
      - broker
      - proxy

  server2:
    build: ./server
    environment:
      - SERVER_ID=2
      - BROKER_URL=tcp://broker:5556
      - PROXY_URL=tcp://proxy:5557
    volumes:
      - ./data/server2:/app/data
    depends_on:
      - broker
      - proxy

  bot_ana:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    environment:
      - BOT_NAME=bot_ana
      - BROKER_URL=tcp://broker:5555
      - PROXY_URL=tcp://proxy:5558
    depends_on:
      - server1
      - server2

  bot_bruno:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    environment:
      - BOT_NAME=bot_bruno
      - BROKER_URL=tcp://broker:5555
      - PROXY_URL=tcp://proxy:5558
    depends_on:
      - server1
      - server2
