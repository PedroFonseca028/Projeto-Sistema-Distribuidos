services:
  broker:
    build: ./broker
    network_mode: host

  proxy:
    build: ./proxy
    network_mode: host

  reference:
    build: ./reference
    network_mode: host
    environment:
      - REF_URL=tcp://*:5559
      - HEARTBEAT_TIMEOUT=10

  server1:
    build: ./server
    network_mode: host
    environment:
      - SERVER_ID=1
      - BROKER_URL=tcp://localhost:5556
      - PROXY_URL=tcp://localhost:5557
      - REF_URL=tcp://localhost:5559
    volumes:
      - ./data/server1:/app/data

  server2:
    build: ./server
    network_mode: host
    environment:
      - SERVER_ID=2
      - BROKER_URL=tcp://localhost:5556
      - PROXY_URL=tcp://localhost:5557
      - REF_URL=tcp://localhost:5559
    volumes:
      - ./data/server2:/app/data

  bot_ana:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    network_mode: host
    environment:
      - BOT_NAME=bot_ana
      - BROKER_URL=tcp://localhost:5555
      - PROXY_URL=tcp://localhost:5558
      - BOT_CREATE=1

  bot_bruno:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    network_mode: host
    environment:
      - BOT_NAME=bot_bruno
      - BROKER_URL=tcp://localhost:5555
      - PROXY_URL=tcp://localhost:5558
      - BOT_CREATE=0