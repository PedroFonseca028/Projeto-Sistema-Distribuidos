services:
  broker:
    build: ./broker
    network_mode: host

  server1:
    build: ./server
    network_mode: host
    environment:
      - SERVER_ID=1
      - BROKER_URL=tcp://localhost:5556
    volumes:
      - ./data/server1:/app/data

  server2:
    build: ./server
    network_mode: host
    environment:
      - SERVER_ID=2
      - BROKER_URL=tcp://localhost:5556
    volumes:
      - ./data/server2:/app/data

  bot_ana:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    network_mode: host
    environment:
      - BOT_NAME=bot_ana
      - BROKER_URL=tcp://localhost:5555
      - BOT_CREATE=1

  bot_bruno:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    network_mode: host
    environment:
      - BOT_NAME=bot_bruno
      - BROKER_URL=tcp://localhost:5555
      - BOT_CREATE=0