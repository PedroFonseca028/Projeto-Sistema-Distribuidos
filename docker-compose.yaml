services:
  broker:
    build: ./broker
    ports:
      - "5555:5555"

  server1:
    build: ./server
    environment:
      - SERVER_ID=1
      - BROKER_URL=tcp://broker:5555
    volumes:
      - ./data/server1:/app/data
    depends_on:
      - broker

  server2:
    build: ./server
    environment:
      - SERVER_ID=2
      - BROKER_URL=tcp://broker:5555
    volumes:
      - ./data/server2:/app/data
    depends_on:
      - broker

  bot_ana:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    environment:
      - BOT_NAME=bot_ana
      - BROKER_URL=tcp://broker:5555
      - BOT_CREATE=1
    depends_on:
      - broker

  bot_bruno:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    environment:
      - BOT_NAME=bot_bruno
      - BROKER_URL=tcp://broker:5555
      - BOT_CREATE=0
    depends_on:
      - broker