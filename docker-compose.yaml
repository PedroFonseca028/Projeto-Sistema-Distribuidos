# Todos os serviços usam a rede criada pelo Docker Compose e se encontram pelo nome do serviço
# (ex.: tcp://broker:5555). Nenhuma porta precisa ser publicada no host.
services:
  broker:
    build: ./broker

  proxy:
    build: ./proxy

  reference:
    build: ./reference
    environment:
      - REF_URL=tcp://*:5559
      - HEARTBEAT_TIMEOUT=10

  server1:
    build: ./server
    depends_on:
      - broker
      - proxy
      - reference
    environment:
      - SERVER_ID=1
      - BROKER_URL=tcp://broker:5556
      - PROXY_URL=tcp://proxy:5557
      - PROXY_SUB_URL=tcp://proxy:5558
      - REF_URL=tcp://reference:5559
    volumes:
      - ./data/server1:/app/data

  server2:
    build: ./server
    depends_on:
      - broker
      - proxy
      - reference
    environment:
      - SERVER_ID=2
      - BROKER_URL=tcp://broker:5556
      - PROXY_URL=tcp://proxy:5557
      - PROXY_SUB_URL=tcp://proxy:5558
      - REF_URL=tcp://reference:5559
    volumes:
      - ./data/server2:/app/data

  bot_ana:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    depends_on:
      - broker
      - proxy
    environment:
      - BOT_NAME=bot_ana
      - BROKER_URL=tcp://broker:5555
      - PROXY_URL=tcp://proxy:5558

  bot_bruno:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    depends_on:
      - broker
      - proxy
    environment:
      - BOT_NAME=bot_bruno
      - BROKER_URL=tcp://broker:5555
      - PROXY_URL=tcp://proxy:5558
